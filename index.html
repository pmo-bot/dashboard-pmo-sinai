<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PMO Sinai 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
        }
        
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #FDFDFF;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .progress-bar-transition {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-[1600px] mx-auto space-y-6">

    <!-- HEADER (igual imagem 1) -->
    <header class="bg-white rounded-3xl shadow-sm border border-slate-100 px-6 py-5">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <!-- Logo + Título -->
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-orange-600 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0">
                    <svg width="36" height="36" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="75" cy="75" r="65" fill="none" stroke="white" stroke-width="10"/>
                        <path d="M 45 95 L 75 45 L 105 95 Z" fill="white"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900">Projetos Sinai</h1>
                    <p class="text-sm text-slate-500 font-medium">Dashboard PMO • Controle de Implantação</p>
                </div>
            </div>

            <!-- KPIs (Cobertura + Clientes Ativos) -->
            <div class="flex items-center gap-12">
                <div class="text-center">
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">Cobertura</p>
                    <div class="flex items-center gap-2">
                        <span class="text-4xl font-black text-orange-500" id="statCoverage">40%</span>
                        <div class="w-20 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="barCoverage" class="h-full bg-orange-500 rounded-full progress-bar-transition" style="width: 40%;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center">
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">Clientes Ativos</p>
                    <div class="flex items-center gap-2 justify-center">
                        <i data-lucide="users" class="w-5 h-5 text-slate-400"></i>
                        <span class="text-4xl font-black text-slate-900" id="statClientes">17</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- HINT -->
    <div class="px-1">
        <p class="text-xs text-slate-500 font-medium bg-white inline-flex items-center gap-2 px-4 py-2 rounded-full border border-slate-100">
            <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-500"></i>
            Clique num módulo para ver o detalhamento
        </p>
    </div>

    <!-- KPI CARDS (sem barras, igual imagem 1) -->
    <div id="kpi-row-1" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4"></div>
    <div id="kpi-row-2" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- GRID (igual imagem 2 e HTML base) -->
    <div class="bg-white rounded-[32px] border border-slate-100 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse" id="clientsTable">
                <thead>
                    <tr class="bg-slate-50/50 border-b border-slate-100" id="tableHeader"></tr>
                </thead>
                <tbody class="divide-y divide-slate-50" id="tableBody"></tbody>
            </table>
        </div>
        
        <!-- Rodapé com botão Ver todos -->
        <div class="px-8 py-5 bg-slate-50/30 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400 font-medium">
            <span id="footerCount">A mostrar 5 de 17 clientes</span>
            <button id="toggleExpand" onclick="toggleExpand()" class="flex items-center gap-2 text-indigo-500 font-bold hover:text-indigo-700 transition-all bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-100">
                <span id="toggleText">Ver todos</span>
                <i data-lucide="chevron-down" id="toggleIcon" class="w-4 h-4 transition-transform duration-300"></i>
            </button>
        </div>
    </div>

</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSN6220bHIwZ9pzMZkhQ1hBT32sofXNn-FSvJYDNGFVKNCtEhpTqF3yg4zz-p25nALcm1J33QeLR_pn/pub?gid=1278980969&single=true&output=csv';

let CLIENTS = [], MODULES = [], DATA = {};
let isExpanded = false;
const INITIAL_ROWS = 5;

const MOD_ICONS = {
    secretaria: 'building-2', tesouraria: 'wallet', financeiro: 'coins', aplicativo: 'smartphone',
    eventos: 'calendar', ebd: 'book-open', 'patrimônio': 'shield-check', patrimonio: 'shield-check',
    acolhimento: 'heart', 'meu departamento': 'users', meudepto: 'users',
    ebl: 'church', 'ebl / célula': 'church', célula: 'church', celula: 'church',
};
const iconFor = k => MOD_ICONS[k.toLowerCase()] || 'layout-grid';

const MOD_DEFS = [
    {id: 'secretaria',  label: 'Secretaria',       keys: ['Secretaria'],                          row: 1},
    {id: 'tesouraria',  label: 'Tesouraria',       keys: ['Tesouraria'],                          row: 1},
    {id: 'financeiro',  label: 'Financeiro',       keys: ['Financeiro'],                          row: 1},
    {id: 'aplicativo',  label: 'Aplicativo',       keys: ['Aplicativo'],                          row: 1},
    {id: 'eventos',     label: 'Eventos',          keys: ['Eventos'],                             row: 1},
    {id: 'ebd',         label: 'EBD',              keys: ['EBD'],                                 row: 1},
    {id: 'patrimonio',  label: 'Patrimônio',       keys: ['Patrimônio', 'Patrimonio'],            row: 2},
    {id: 'acolhimento', label: 'Acolhimento',      keys: ['Acolhimento'],                         row: 2},
    {id: 'meudepto',    label: 'Meu Departamento', keys: ['Meu Departamento', 'Departamento'],    row: 2},
    {id: 'ebl',         label: 'EBL / Célula',     keys: ['EBL', 'Célula', 'Celula', 'EBL/Célula'], row: 2},
];

function parseCSV(text) {
    return text.split('\n').map(row => {
        const cols = []; let cur = '', inQ = false;
        for (const ch of row) {
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else cur += ch;
        }
        cols.push(cur.trim());
        return cols;
    });
}

async function loadSheetData() {
    try {
        const rows = parseCSV(await (await fetch(SHEET_URL)).text());
        MODULES = rows[1].slice(1, 11).filter(m => m?.trim());
        CLIENTS = [];
        DATA = {};
        
        MODULES.forEach(m => DATA[m] = []);
        
        for (let i = 2; i < rows.length; i++) {
            const row = rows[i];
            if (!row[0]?.trim()) continue;
            
            const id = 'u' + (i - 2);
            CLIENTS.push({id, label: row[0].trim()});
            
            MODULES.forEach((m, mi) => DATA[m].push((row[mi + 1] || 'NI').trim()));
        }
        
        renderKPIs();
        renderTable();
    } catch (e) {
        console.error(e);
        alert('Erro ao carregar planilha.');
    }
}

const ps = raw => (raw || '').split('|')[0].trim();

function wt(s) {
    if (s === 'ID') return 100;
    if (s === 'US') return 80;
    if (s.startsWith('EI')) {
        const m = s.match(/(\d+)%/);
        return m ? +m[1] : 50;
    }
    return 0;
}

function findMod(keys) {
    for (const k of keys) {
        if (DATA[k]) return DATA[k];
        const hit = Object.keys(DATA).find(dk => 
            dk.toLowerCase().includes(k.toLowerCase()) || 
            k.toLowerCase().includes(dk.toLowerCase().substring(0, Math.max(4, dk.length - 2)))
        );
        if (hit) return DATA[hit];
    }
    return null;
}

function buildCard(def, total) {
    const icon = iconFor(def.id === 'meudepto' ? 'meu departamento' : def.id);
    
    return `<div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm group hover:shadow-md transition-all cursor-pointer">
        <div class="flex items-start justify-between mb-3">
            <div class="w-12 h-12 bg-orange-500 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0">
                <i data-lucide="${icon}" class="w-6 h-6 text-white"></i>
            </div>
            <div class="text-right">
                <div class="text-3xl font-black text-slate-900">${total}</div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total</div>
            </div>
        </div>
        <div class="text-sm font-bold text-slate-600">${def.label}</div>
    </div>`;
}

function renderKPIs() {
    let tc = 0, tw = 0;
    Object.values(DATA).forEach(col => col.forEach(raw => {
        const s = ps(raw);
        if (!s || s === 'N/A') return;
        tc++;
        tw += wt(s);
    }));
    
    const cov = tc ? Math.round(tw / tc) : 0;
    document.getElementById('statCoverage').textContent = cov + '%';
    document.getElementById('barCoverage').style.width = cov + '%';
    document.getElementById('statClientes').textContent = CLIENTS.length;

    const r1 = document.getElementById('kpi-row-1'), r2 = document.getElementById('kpi-row-2');
    r1.innerHTML = '';
    r2.innerHTML = '';

    MOD_DEFS.forEach(def => {
        const col = findMod(def.keys);
        let total = 0;
        
        if (col) col.forEach(raw => {
            const s = ps(raw);
            if (!s || s === 'N/A') return;
            total++;
        });
        
        (def.row === 1 ? r1 : r2).insertAdjacentHTML('beforeend', buildCard(def, total));
    });
    
    lucide.createIcons();
}

function cprog(idx) {
    let tot = 0, w = 0;
    MODULES.forEach(m => {
        const s = ps(DATA[m][idx]);
        if (!s || s === 'N/A') return;
        tot++;
        w += wt(s);
    });
    return tot ? Math.round(w / tot) : 0;
}

function getStatusBadge(status) {
    const colors = {
        'ID': 'bg-green-50 text-green-700 border-green-200',
        'US': 'bg-cyan-50 text-cyan-700 border-cyan-200',
        'EI': 'bg-amber-50 text-amber-700 border-amber-200',
        'NI': 'bg-purple-50 text-purple-700 border-purple-200',
        'N/A': 'bg-slate-50 text-slate-500 border-slate-200'
    };
    
    let colorClass = colors['N/A'];
    if (status === 'ID') colorClass = colors['ID'];
    else if (status === 'US') colorClass = colors['US'];
    else if (status.startsWith('EI')) colorClass = colors['EI'];
    else if (status === 'NI') colorClass = colors['NI'];
    
    return `<span class="inline-flex items-center justify-center px-3 py-1.5 rounded-xl text-xs font-bold border ${colorClass}">${status}</span>`;
}

function renderTable() {
    const thead = document.getElementById('tableHeader');
    const tbody = document.getElementById('tableBody');
    
    // Header
    let headerHtml = `<th class="sticky-col px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Cliente & Saúde</th>`;
    MODULES.forEach(m => {
        headerHtml += `<th class="px-4 py-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">${m}</th>`;
    });
    thead.innerHTML = headerHtml;
    
    // Body
    let bodyHtml = '';
    const displayClients = isExpanded ? CLIENTS : CLIENTS.slice(0, INITIAL_ROWS);
    
    displayClients.forEach((cl, idx) => {
        const actualIdx = CLIENTS.findIndex(c => c.id === cl.id);
        const prog = cprog(actualIdx);
        
        // Cor da bolinha baseada no progresso
        let dotColor = 'bg-purple-500';
        if (prog >= 75) dotColor = 'bg-green-500';
        else if (prog >= 50) dotColor = 'bg-cyan-500';
        else if (prog >= 25) dotColor = 'bg-amber-500';
        else if (prog > 0) dotColor = 'bg-red-500';
        
        bodyHtml += `<tr class="group hover:bg-slate-50/50 transition-all">
            <td class="sticky-col px-6 py-5">
                <div class="flex items-center gap-4">
                    <div class="w-2 h-2 rounded-full ${dotColor} flex-shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-slate-900 text-sm mb-1">${cl.label}</div>
                        <div class="flex items-center gap-2">
                            <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full ${dotColor} rounded-full progress-bar-transition" style="width: ${prog}%;"></div>
                            </div>
                            <span class="text-xs font-bold text-slate-500 tabular-nums w-10 text-right">${prog}%</span>
                        </div>
                    </div>
                </div>
            </td>`;
        
        MODULES.forEach(m => {
            const status = ps(DATA[m][actualIdx] || 'N/A');
            bodyHtml += `<td class="px-4 py-5 text-center">${getStatusBadge(status)}</td>`;
        });
        
        bodyHtml += '</tr>';
    });
    
    tbody.innerHTML = bodyHtml;
    
    // Atualizar footer
    document.getElementById('footerCount').textContent = 
        `A mostrar ${displayClients.length} de ${CLIENTS.length} clientes`;
    
    lucide.createIcons();
}

function toggleExpand() {
    isExpanded = !isExpanded;
    document.getElementById('toggleText').textContent = isExpanded ? 'Ver menos' : 'Ver todos';
    document.getElementById('toggleIcon').style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
    renderTable();
}

window.onload = () => {
    lucide.createIcons();
    loadSheetData();
};

setInterval(loadSheetData, 300000);
</script>

</body>
</html>
